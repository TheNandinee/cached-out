proxy_cache_path /var/cache/nginx keys_zone=live:10m max_size=50m inactive=10m;
server {
  listen __PORT__;
  location = / {
    proxy_pass http://127.0.0.1:3000;
    proxy_cache live;
    proxy_cache_key "$scheme$host$request_uri";   # nginx's default behaviour: cookies are not part of the key
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
  }
  location / { proxy_pass http://127.0.0.1:3000; }
}

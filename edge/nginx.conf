proxy_cache_path /var/cache/nginx keys_zone=pages:10m max_size=200m inactive=10m;
upstream app { server app:3000; }

# r1 — no cache (baseline)
server { listen 8081;
  location / { proxy_pass http://app; proxy_set_header X-Run r1;
    add_header X-Cache-Status BYPASS always; } }

# r2 — THE BUG: shared cache, key ignores uid cookie, app's no-store ignored. 1 s TTL.
server { listen 8082;
  location / { proxy_pass http://app; proxy_set_header X-Run r2;
    proxy_cache pages; proxy_cache_key "r2$request_uri"; proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always; } }

# r3 — same bug, 10 s TTL, page logs the RENDERED variant
server { listen 8083;
  location / { proxy_pass http://app; proxy_set_header X-Run r3;
    proxy_cache pages; proxy_cache_key "r3$request_uri"; proxy_cache_valid 200 10s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always; } }

# r4 — THE FIX: r2 minus one line (proxy_ignore_headers), so no-store is respected
server { listen 8084;
  location / { proxy_pass http://app; proxy_set_header X-Run r4;
    proxy_cache pages; proxy_cache_key "r4$request_uri"; proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always; } }

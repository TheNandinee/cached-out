<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect width="1200" height="420" fill="#0A0805"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFB43A"/></marker></defs>
<text x="40" y="44" fill="#FFD28A" font-size="22"># how a cache rewrites an experiment</text>
<rect x="40" y="80" width="230" height="80" fill="none" stroke="#FFB43A" stroke-width="2"/><text x="56" y="112" fill="#FFB43A" font-size="19" font-weight="700">visitor A</text><text x="56" y="138" fill="#9B7A3E" font-size="14">assigned: headline A</text>
<rect x="480" y="80" width="240" height="80" fill="none" stroke="#FFB43A" stroke-width="2"/><text x="496" y="112" fill="#FFB43A" font-size="19" font-weight="700">cache (5 s)</text><text x="496" y="138" fill="#9B7A3E" font-size="14">key ignores cookies</text>
<rect x="930" y="80" width="230" height="80" fill="none" stroke="#FFB43A" stroke-width="2"/><text x="946" y="112" fill="#FFB43A" font-size="19" font-weight="700">app</text><text x="946" y="138" fill="#9B7A3E" font-size="14">renders A for visitor A</text>
<line x1="270" y1="120" x2="478" y2="120" stroke="#FFB43A" stroke-width="2" marker-end="url(#a)"/><text x="374.0" y="110" fill="#FFB43A" font-size="13" text-anchor="middle">miss</text><line x1="720" y1="120" x2="928" y2="120" stroke="#FFB43A" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="240" width="230" height="80" fill="none" stroke="#59E6F2" stroke-width="2"/><text x="56" y="272" fill="#59E6F2" font-size="19" font-weight="700">visitor B</text><text x="56" y="298" fill="#9B7A3E" font-size="14">assigned: headline B</text>
<line x1="270" y1="280" x2="478" y2="175" stroke="#FF4B3E" stroke-width="2" marker-end="url(#a)"/><text x="374.0" y="165" fill="#FF4B3E" font-size="13" text-anchor="middle">hit: gets A's page</text>
<rect x="930" y="240" width="230" height="80" fill="none" stroke="#59E6F2" stroke-width="2"/><text x="946" y="272" fill="#59E6F2" font-size="19" font-weight="700">flagsmith</text><text x="946" y="298" fill="#9B7A3E" font-size="14">logs B under headline B</text>
<line x1="270" y1="300" x2="928" y2="300" stroke="#59E6F2" stroke-width="2" marker-end="url(#a)"/><text x="599.0" y="290" fill="#59E6F2" font-size="13" text-anchor="middle">exposure + click credited to B</text>
